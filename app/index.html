<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light only">
  <title>WORD LAB | 단어 시험지 생성기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lexend:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261020-print-layout-2">
</head>
<body>
  <div id="header">
    <div class="header-copy">
      <h1>WORD LAB</h1>
    </div>
    <div class="badge">WORKSPACE</div>
  </div>

  <div class="page-shell">
    <main class="workspace-panel">
      <div class="workspace-stack">
        <section class="class-section">
          <div class="card-head">
            <div>
              <div class="card-label">반별 입력</div>
              <h2>엑셀에서 붙여넣기</h2>
            </div>
            <div class="card-actions">
              <button class="btn btn-ghost" type="button" id="add-class-btn">반 추가</button>
              <button class="btn btn-ghost" type="button" id="seed-demo-btn">예시 채우기</button>
            </div>
          </div>
          <div class="status-panel info" id="validation-notes" role="status" aria-live="polite">반과 단어를 입력하면 여기서 검사가 표시됩니다.</div>
          <div class="class-list" id="class-list"></div>
        </section>
      </div>
    </main>
    <aside class="hero-panel sidebar-panel">
      <div class="sidebar-stack">
        <section class="control-card save-root-card">
          <div class="field-block">
            <label class="field-title">저장 루트</label>
            <div class="save-root-box">
              <div id="save-root-status" aria-live="polite">미연결</div>
              <button class="btn btn-blue" type="button" id="pick-folder-btn">저장 폴더 연결</button>
            </div>
          </div>
        </section>

        <section class="action-card action-card-sidebar">
          <button class="btn btn-green btn-xl" type="button" id="generate-btn">PDF 생성 시작</button>
        </section>

        <section class="summary-card summary-card-compact">
          <div class="summary-metrics">
            <div class="metric">
              <span class="metric-label">반 수</span>
              <strong id="metric-class-count">0</strong>
            </div>
            <div class="metric">
              <span class="metric-label metric-label-multiline">생성 예정 PDF<br>(답지 포함)</span>
              <strong id="metric-pdf-count">0</strong>
            </div>
          </div>
        </section>

        <div class="summary-notes">
          <div class="status-panel info" id="input-editing-notice" role="status" aria-live="polite" hidden>
            <p id="input-editing-message"></p>
            <button class="btn btn-ghost" type="button" id="acquire-input-btn">이 탭의 편집권 확인</button>
          </div>
          <div class="status-panel info" id="auth-status" role="status" aria-live="polite" hidden></div>
          <button class="btn btn-ghost" type="button" id="input-scope-btn" hidden>로그인 저장 입력 열기</button>
          <div class="status-panel success" id="run-status" role="status" aria-live="polite" aria-atomic="true">아직 생성 전입니다.</div>
          <div class="status-panel warning" id="storage-warning" role="alert" hidden>
            <p>입력이 자동 저장되지 않았습니다. 이 탭을 닫기 전에 ‘입력 백업’으로 JSON 파일을 저장해 주세요.</p>
            <button class="btn btn-ghost" type="button" id="retry-save-btn">자동 저장 다시 시도</button>
          </div>
        </div>

        <section class="control-card preset-card">
          <div class="preset-grid">
            <div class="field-block">
              <label class="field-title">반 그룹</label>
              <div class="segmented compact" id="preset-toggle" role="group" aria-label="반 그룹">
                <label class="segment">
                  <input type="radio" name="class-preset" value="mon-wed" checked>
                  <span>월수반</span>
                </label>
                <label class="segment">
                  <input type="radio" name="class-preset" value="tue-thu">
                  <span>화목반</span>
                </label>
              </div>
            </div>

            <label class="field-block">
              <span class="field-title">담당 선생님</span>
              <input class="text-input" id="teacher-name" type="text" placeholder="예: 홍길동">
            </label>

            <div class="field-block">
              <label class="field-title" for="output-date">자료 날짜</label>
              <input class="text-input" id="output-date" type="date">
              <div class="date-quick-actions" aria-label="빠른 자료 날짜 선택">
                <button class="date-quick-btn" type="button" data-date-offset="0">오늘</button>
                <button class="date-quick-btn" type="button" data-date-offset="1">+1일</button>
                <button class="date-quick-btn" type="button" data-date-offset="2">+2일</button>
              </div>
            </div>

            <div class="output-folder-preview" aria-live="polite">
              <span class="field-title">생성 폴더 / ZIP</span>
              <strong id="output-folder-preview">날짜를 선택해 주세요.</strong>
              <small id="output-folder-preview-note">같은 이름이 있으면 _2, _3이 자동으로 붙습니다.</small>
            </div>

            <div class="preset-tools">
              <button class="btn btn-ghost" type="button" id="toggle-layout-lock-btn">반 구성 편집</button>
              <button class="btn btn-ghost" type="button" id="import-snapshot-btn">파일 복원</button>
              <button class="btn btn-ghost" type="button" id="export-snapshot-btn">입력 백업</button>
            </div>
            <div class="recovery-notice" id="undo-notice" hidden>
              <span>직전 교체·삭제 전 입력을 이 탭에서 복구할 수 있습니다. 탭을 닫거나 새로고침하면 되돌릴 수 없습니다.</span>
              <button class="btn btn-ghost" type="button" id="undo-replacement-btn">직전 입력 되돌리기</button>
            </div>
          </div>
        </section>

        <section class="control-card">
          <div class="control-grid">
            <div class="field-block">
              <label class="field-title" for="question-count">시험지당 문항 수</label>
              <input class="text-input" id="question-count" type="number" min="5" max="100" step="1" value="50">
              <div class="class-validation" id="question-count-validation" hidden></div>
            </div>

            <div class="field-block">
              <label class="field-title">생성할 차수</label>
              <div class="session-stepper" id="session-toggle">
                <button class="stepper-btn" type="button" id="session-count-decrease" aria-label="차수 줄이기">&#8592;</button>
                <div class="stepper-display" aria-live="polite">
                  <span class="stepper-value" id="session-count-display">3차</span>
                </div>
                <button class="stepper-btn" type="button" id="session-count-increase" aria-label="차수 늘리기">&#8594;</button>
                <input type="hidden" id="session-count-input" value="3">
              </div>
            </div>
          </div>
        </section>
      </div>
    </aside>

  </div>

  <template id="class-card-template">
    <article class="class-card">
      <div class="class-card-head">
        <div class="class-card-heading">
          <div class="card-label">CLASS SLOT</div>
          <h3 class="class-title">기본반</h3>
        </div>
        <button class="icon-btn remove-class-btn" type="button" aria-label="반 삭제">삭제</button>
      </div>

      <div class="class-form-grid">
        <label class="field-block">
          <span class="field-title">반 이름</span>
          <input class="text-input class-name-input" type="text" placeholder="예: 2강서B">
        </label>
        <div class="field-block class-mode-field">
          <span class="field-title">출제 방향</span>
          <div class="segmented compact class-mode-toggle" role="group" aria-label="출제 방향">
            <label class="segment">
              <input class="class-quiz-mode-input" type="radio" value="word-to-meaning" checked>
              <span>영 - 한</span>
            </label>
            <label class="segment">
              <input class="class-quiz-mode-input" type="radio" value="meaning-to-word">
              <span>한 - 영</span>
            </label>
          </div>
        </div>
        <div class="stat-chip-group">
          <span class="stat-chip"><strong class="valid-count">0</strong> 유효 단어</span>
          <span class="stat-chip"><strong class="merged-count">0</strong> 중복 합치기</span>
          <span class="stat-chip"><strong class="invalid-count">0</strong> 제외 줄</span>
        </div>
      </div>

      <div class="class-validation" hidden></div>
      <div class="class-editor-grid">
        <label class="field-block class-editor-pane">
          <span class="field-title">단어 / 뜻 붙여넣기</span>
          <textarea class="paste-area" spellcheck="false" placeholder="abandon[TAB]버리다&#10;ability[TAB]능력&#10;..."></textarea>
        </label>

        <div class="field-block class-editor-pane">
          <span class="field-title">미리보기</span>
          <div class="preview-area">
            <div class="preview-list"></div>
            <div class="preview-note"></div>
          </div>
        </div>
      </div>
    </article>
  </template>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="render-stage" id="render-stage" aria-hidden="true"></div>
  <input type="file" id="snapshot-file-input" accept=".json,application/json" hidden>

  <script src="./vendor/html2canvas.min.js"></script>
  <script src="./vendor/jspdf.umd.min.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./app.js?v=20261020-print-layout-2"></script>
</body>
</html>
